<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multilaser Creations – Boutique</title>
<meta name="theme-color" content="#0f0f0f">
<meta name="description" content="Les parfaitements imparfaits. Revalorisation • Bois récupéré • Fait au Québec">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f0f0f;color:#f0f0f0;line-height:1.5;min-height:100vh}
.welcome-banner{background:#14110e;border-bottom:1px solid #2a2218;padding:28px 20px 24px;text-align:center}
.logo{display:block;margin:0 auto;width:min(640px,94vw);height:auto;border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.55);border:1px solid #3a2a1a}
header{text-align:center;padding:36px 20px 30px;border-bottom:1px solid #222}
.badge{display:inline-block;background:#1a1a1a;border:1px solid #333;color:#aaa;font-size:12px;padding:5px 12px;border-radius:20px;margin-bottom:18px}
h1{font-size:2rem;font-weight:600;margin-bottom:8px}
.tagline{color:#999;font-size:1.05rem;margin-bottom:6px}
.location{color:#666;font-size:.85rem;margin-bottom:18px}
.nav a{color:#ccc;text-decoration:none;margin:0 12px;font-size:.95rem;border-bottom:1px solid #444;padding-bottom:2px}
.container{max-width:900px;margin:0 auto;padding:40px 20px 60px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:24px;display:flex;flex-direction:column}
.card h2{font-size:1.1rem;margin-bottom:10px}
.card p{color:#999;font-size:.9rem;flex-grow:1;margin-bottom:18px}
.price{font-size:1.25rem;font-weight:600;margin-bottom:16px}
.btn{display:inline-block;background:#fff;color:#111;text-decoration:none;text-align:center;padding:12px 18px;border-radius:8px;font-weight:600}
.btn.secondary{background:transparent;border:1px solid #444;color:#ccc}
.note{margin-top:40px;text-align:center;color:#666;font-size:.85rem}
footer{text-align:center;padding:30px 20px;border-top:1px solid #222}
footer a{color:#888;text-decoration:none;margin:0 10px}
</style>
</head>
<body>
<div class="welcome-banner">
<img class="logo" src="logo.jpg" alt="Multilaser Créations">
</div>
</body>
</html>

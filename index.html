<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multilaser Creations – Bientôt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #111;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 520px;
    }
    .badge {
      display: inline-block;
      background: #222;
      border: 1px solid #444;
      color: #aaa;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 2.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .tagline {
      font-size: 1.1rem;
      color: #bbb;
      margin-bottom: 32px;
    }
    .divider {
      width: 40px;
      height: 2px;
      background: #444;
      margin: 0 auto 32px;
    }
    p {
      color: #999;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .links {
      margin-top: 36px;
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      color: #eee;
      text-decoration: none;
      font-size: 0.9rem;
      border-bottom: 1px solid #555;
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .links a:hover {
      color: #fff;
      border-color: #fff;
    }
    .footer {
      margin-top: 50px;
      font-size: 0.8rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">EN CONSTRUCTION</div>
    
    <h1>Multilaser Creations</h1>
    <div class="tagline">Les parfaitements imparfaits</div>
    
    <div class="divider"></div>
    
    <p>Créations laser & upcycling</p>
    <p>Bois récupéré • Fait au Québec</p>
    
    <div class="links">
      <a href="https://www.youtube.com/@multilasercreations" target="_blank">YouTube</a>
      <a href="https://www.instagram.com/multilasercreations" target="_blank">Instagram</a>
    </div>
    
    <div class="footer">
      Mont-Laurier / Laurentides
    </div>
  </div>
</body>
</html>
